# ============================================================================
#  Môi trường `local` — docs/11-kien-truc-va-technology-stack.md mục 12.1
#  Dựng đủ hạ tầng để chạy Backend mà không cần cloud.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartface-postgres
    environment:
      POSTGRES_USER: smartface
      POSTGRES_PASSWORD: smartface
      POSTGRES_DB: smartface
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartface']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartface-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: smartface-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://smartface:smartface@postgres:5432/smartface?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Ảnh và file báo cáo nằm trên Cloud Storage for Firebase — không còn
      # container lưu trữ chạy cục bộ. Bốn biến dưới lấy từ `.env` cạnh file này
      # (docker compose tự đọc `.env` để thay thế biến), xem .env.example.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      AI_SERVER_URL: http://ai-server:8000
      AI_SERVER_INTERNAL_KEY: dev-internal-key
      JWT_SECRET: dev-only-change-me
      JWT_ALGORITHM: HS256
      OTP_DEBUG_RETURN: 'true'
      SMS_PROVIDER: console
      # Pod API không xử lý job — xem docs/02 mục 12.2.
      WORKER_ENABLED: 'false'
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/main"

  worker:
    build: .
    container_name: smartface-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://smartface:smartface@postgres:5432/smartface?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Ảnh và file báo cáo nằm trên Cloud Storage for Firebase — không còn
      # container lưu trữ chạy cục bộ. Bốn biến dưới lấy từ `.env` cạnh file này
      # (docker compose tự đọc `.env` để thay thế biến), xem .env.example.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      AI_SERVER_URL: http://ai-server:8000
      AI_SERVER_INTERNAL_KEY: dev-internal-key
      JWT_SECRET: dev-only-change-me
      JWT_ALGORITHM: HS256
      SMS_PROVIDER: console
      WORKER_ENABLED: 'true'
    command: node dist/worker

volumes:
  postgres-data:
  redis-data:
