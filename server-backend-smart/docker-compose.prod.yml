# ============================================================================
#  Môi trường `production` trên VPS — dùng cùng Dockerfile với dev, khác ở:
#    - Không expose Postgres/Redis ra host (chỉ nội bộ trong network này).
#    - Mọi secret đọc từ file `.env` cạnh file này (KHÔNG commit vào git,
#      tạo một lần trên VPS — xem docs/22-huong-dan-deploy-vps.md mục 3).
#    - restart: unless-stopped để tự phục hồi khi VPS reboot / container chết.
#
#  Chạy:  docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartface-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD bắt buộc trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartface}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smartface}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartface-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD bắt buộc trong .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: smartface-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartface}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartface}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Ảnh và file báo cáo nằm trên Cloud Storage for Firebase. Không còn dịch
      # vụ lưu trữ nào chạy trên VPS này — dung lượng và sao lưu do Google lo.
      # FIREBASE_* đọc từ `.env` qua `env_file` ở trên.
      WORKER_ENABLED: 'false'
    ports:
      # ⚠ Chưa có Nginx/TLS phía trước — API đang lộ HTTP thẳng ra internet.
      #   Cách bịt (đổi thành '127.0.0.1:3000:3000' + thêm service nginx):
      #   docs/22-huong-dan-deploy-vps.md mục 7.
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/main"

  worker:
    build: .
    container_name: smartface-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartface}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartface}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Ảnh và file báo cáo nằm trên Cloud Storage for Firebase. Không còn dịch
      # vụ lưu trữ nào chạy trên VPS này — dung lượng và sao lưu do Google lo.
      # FIREBASE_* đọc từ `.env` qua `env_file` ở trên.
      WORKER_ENABLED: 'true'
    command: node dist/worker

volumes:
  postgres-data:
  redis-data:
