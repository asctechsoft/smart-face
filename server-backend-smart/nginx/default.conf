# ============================================================================
#  SmartFace — nginx đứng trước SPA (web-smart) và Backend (api).
#
#    Internet ─► Cloudflare ─► nginx :443 ─┬─ /v1/, /health, /ws ─► api:3000
#                                          └─ mọi đường dẫn khác ─► file tĩnh SPA
#
#  SPA và API PHẢI cùng origin: web-smart gọi API bằng đường dẫn tương đối /v1,
#  nên không cần CORS và cookie đi kèm tự nhiên.
#
#  Không có tên miền nào trong file này (`server_name _`): chứng chỉ Origin của
#  Cloudflare chỉ Cloudflare tin, và mọi request đều đã đi qua Cloudflare
#  (cloudflare-only.conf), nên nginx không cần biết tên miền là gì.
# ============================================================================

# Cổng 80: chỉ để chuyển sang HTTPS. Cloudflare "Always Use HTTPS" thường đã
# chuyển từ trước, đây là lớp dự phòng.
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/cloudflare-only.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Chứng chỉ Origin tạo ở Cloudflare → SSL/TLS → Origin Server.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-only.conf;

    # Tra `api` qua DNS nội bộ của Docker MỖI LẦN cần (hết hạn sau 10s) thay
    # vì một lần lúc khởi động. Mỗi lần deploy container api được tạo lại và có
    # thể đổi IP; tra một lần thì nginx cứ gọi vào IP cũ và trả 502 cho tới khi
    # ai đó nhớ restart nó.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Ảnh chấm công đi qua đây. Backend giới hạn JSON 10mb (src/main.ts); để
    # nginx rộng hơn một chút để lỗi hiện ra ở tầng ứng dụng kèm mã lỗi rõ ràng
    # thay vì 413 trống trơn của nginx.
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    location /v1/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # NỐI THÊM chứ không ghi đè: Backend đếm ngược TRUSTED_PROXY_HOPS mục
        # từ bên phải để tìm IP thật (AF-02b).
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # `/health` nằm NGOÀI prefix v1 (setGlobalPrefix có exclude).
    location = /health {
        proxy_pass       $api_upstream;
        proxy_set_header Host $host;
        access_log       off;
    }

    # Số liệu nội bộ, không bao giờ ra internet. Prometheus (nếu có) gọi thẳng
    # api:3000 trong mạng Docker.
    location = /metrics {
        return 404;
    }

    # --- WebSocket — thông báo realtime (src/modules/notification/realtime.gateway.ts)
    # Gateway khai `path: '/ws'`, KHÔNG phải `/socket.io/` mặc định.
    location /ws {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- SPA tĩnh ----------------------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    # Tên file trong /assets/ có mã băm nội dung, đổi code là đổi tên — cache
    # vĩnh viễn được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # `try_files ... /index.html` là BẮT BUỘC với SPA: React Router xử lý đường
    # dẫn ở phía trình duyệt, nginx không có file `/attendance` nên thiếu dòng
    # này thì bấm F5 ở một trang con sẽ nhận 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html không được cache, nếu không người dùng vẫn chạy bản cũ sau
        # khi deploy, trỏ tới những file assets đã không còn.
        add_header Cache-Control "no-cache";
    }
}
