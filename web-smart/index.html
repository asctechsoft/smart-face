<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta
      name="description"
      content="SmartFace — Hệ thống quản lý chấm công bằng nhận diện khuôn mặt và vân tay."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- docs/16 mục 3.1 — Inter cho toàn bộ, Plus Jakarta Sans cho đúng 3 vai trò -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- docs/16 mục 9 — bộ icon Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0"
      rel="stylesheet"
    />

    <title>SmartFace · Quản lý chấm công</title>

    <!--
      Đặt chế độ sáng/tối TRƯỚC khi trang vẽ lần đầu.

      Nếu để React làm việc này thì có một khoảnh khắc trang đã vẽ bằng thang màu
      sáng rồi mới nhảy sang tối — người dùng chế độ tối bị loá mắt mỗi lần tải
      trang. Đoạn script này chặn render, nên phải cực ngắn và không được ném lỗi;
      `try/catch` là vì localStorage bị chặn trong chế độ riêng tư.

      `ThemeProvider` (`src/theme/use-theme.ts`) tiếp quản sau đó.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sf.theme');
          var resolved =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-sf-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-sf-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
